name: Frontend build and deploy

on:
  push:
    branches:
      - frontend

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Frontend Dockerfile build
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hibnbfrontend .
      - name: Push Frontend Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hibnbfrontend
  

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Docker pull and run
        uses: appleboy/ssh-action@v0.1.10
        with:
          username: ubuntu
          host: ${{ secrets.LIVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ "$(sudo docker ps -a -q -f name=hibnbfrontend)" ]; then
              sudo docker rm -f hibnbfrontend
            fi
            if [ "$(sudo docker images -q ${{ secrets.DOCKERHUB_USERNAME }}/hibnbfrontend)" ]; then
              sudo docker rmi -f ${{ secrets.DOCKERHUB_USERNAME }}/hibnbfrontend
            fi          
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hibnbfrontend         
            sudo docker run -d -p 80:80 --name hibnbfrontend ${{ secrets.DOCKERHUB_USERNAME }}/hibnbfrontend
            
      
