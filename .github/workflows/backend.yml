name: Build and Push Docker Images

on:
  push:
    branches:
      - backend

jobs: # 잡스 밑의 이름은 지어준 이름
  build_and_push:
    runs-on: ubuntu-latest
    #    풀 받고 실행

    steps:
      #      - 1도커헙 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #        2checkout 코드/ uses: 깃허브에 복사된 내용을 현재 컨테이너로 복사
      - name: Checkout respository
        uses: actions/checkout@v4

      #        3. mysql docker 이미지 빌드 및 푸시
      - name: BUild MySQL Docker image
        working-directory: db #db 폴더로 이동
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hibnbdb .
      - name: PUSH MySQL Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hibnbdb
      #          4. backend docker 이미지 빌드 및 푸시
      - name: Build Backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hibnbbackend .
      - name: Push Backend Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hibnbbackend

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Docker pull and run
        uses: appleboy/ssh-action@v0.1.10
        with:
          username: ubuntu
          host: ${{ secrets.LIVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ "$(sudo docker ps -a -q -f name=hibnbdb)" ]; then
              sudo docker rm -f hibnbdb
            fi
            if [ "$(sudo docker ps -a -q -f name=hibnbbackend)" ]; then
              sudo docker rm -f hibnbbackend
            fi
            if [ "$(sudo docker images -q ${{ secrets.DOCKERHUB_USERNAME }}/hibnbdb)" ]; then
              sudo docker rmi -f ${{ secrets.DOCKERHUB_USERNAME }}/hibnbdb
            fi
            if [ "$(sudo docker images -q ${{ secrets.DOCKERHUB_USERNAME }}/hibnbbackend)" ]; then
              sudo docker rmi -f ${{ secrets.DOCKERHUB_USERNAME }}/hibnbbackend
            fi
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hibnbdb
            sudo docker run -d -p 3308:3306 --name hibnbdb -v hibnbdb_volume:/var/lib/mysql ${{ secrets.DOCKERHUB_USERNAME }}/hibnbdb
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hibnbbackend
            sudo docker run -d -p 8000:8080 --name hibnbbackend ${{ secrets.DOCKERHUB_USERNAME }}/hibnbbackend





